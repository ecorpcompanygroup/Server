<style>
    *{margin:0;padding:0;font-size:20px;font-family:Cambria,sans-serif;text-decoration:none;list-style:none;border:none;box-sizing:border-box}
    :root {--bg: #ffffff;--text: #000000;}
    :root[data-theme="dark"] {--bg: #121212;--text: #ffffff;}
    body{position:fixed;width:100%;height:100%;overflow:hidden;text-align:center;background:var(--bg);color:var(--text)}
    .splash{position:relative;width:100%;height:100vh;min-height:600px;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:hidden;background:radial-gradient(circle at 50% 35%,rgba(101,43,255,.12),transparent 30%),radial-gradient(circle at 20% 80%,rgba(34,92,255,.08),transparent 30%),#030711}
    .logo-wrap{position:relative;width:125px;height:125px;display:flex;align-items:center;justify-content:center;margin-bottom:22px}
    .logo-wrap::before{content:"";position:absolute;inset:5px;border-radius:35px;filter:blur(25px)}
    .logo{position:relative;z-index:2;width:92px;height:92px;display:flex;align-items:center;justify-content:center;border-radius:27px;font-size:78px;line-height:1;font-weight:900;font-family:Arial,Helvetica,sans-serif;color:transparent;-webkit-background-clip:text;background-clip:text}
    h1{position:relative;font-size:42px;line-height:1;letter-spacing:-1.5px;font-weight:800;margin-bottom:9px;color:#fff;text-shadow:0 0 25px rgba(255,255,255,.08)}
    .subtitle{position:relative;font-size:10px;letter-spacing:3px;font-weight:700;color:#9873ff;margin-bottom:24px}
    .description{position:relative;max-width:280px;color:#788397;font-size:13px;line-height:1.7;font-weight:400}
    .loading{position:absolute;bottom:48px;left:50%;transform:translateX(-50%);width:min(230px,calc(100% - 50px));display:flex;flex-direction:column;align-items:center;gap:10px}
    .loading-track{width:100%;height:3px;border-radius:10px;overflow:hidden;background:rgba(255,255,255,.08)}
    .loading-bar{width:35%;height:100%;border-radius:10px;background:linear-gradient(90deg,#5e25ff,#a05cff,#376eff);box-shadow:0 0 12px rgba(121,65,255,.7);animation:loading 2s ease-in-out infinite}
    .loading span{font-size:9px;letter-spacing:.8px;color:#596477}
    .glow{position:absolute;border-radius:50%;pointer-events:none;filter:blur(70px);opacity:.35}
    .glow-one{width:250px;height:250px;top:-100px;left:-100px;background:rgba(72,35,255,.22)}
    .glow-two{width:250px;height:250px;right:-120px;bottom:-100px;background:rgba(35,91,255,.15)}
    .network{position:absolute;width:260px;height:260px;border-radius:50%;border:1px solid rgba(105,65,255,.06);pointer-events:none}
    .network-one{top:5%;right:-150px;box-shadow:0 0 0 35px rgba(100,60,255,.025),0 0 0 70px rgba(100,60,255,.018),0 0 0 105px rgba(100,60,255,.012)}
    .network-two{bottom:-160px;left:-140px;box-shadow:0 0 0 35px rgba(40,90,255,.025),0 0 0 70px rgba(40,90,255,.018),0 0 0 105px rgba(40,90,255,.012)}
    @keyframes loading{0%{transform:translateX(-120%)}50%{transform:translateX(170%)}100%{transform:translateX(300%)}}
    @keyframes logoFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
    @media(max-width:480px){.logo-wrap{width:115px;height:115px}.logo{width:85px;height:85px;font-size:72px}h1{font-size:38px}.subtitle{font-size:9px;letter-spacing:2.5px}.description{font-size:12px;max-width:250px}.loading{bottom:38px}}
</style>
