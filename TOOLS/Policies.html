border-color:var(--primary);box-shadow:0 0 0 4px var(--primary-soft);background:var(--surface-strong)}.policy input[type=checkbox],.policy input[type=radio]{accent-color:var(--primary);width:18px;height:18px}.policy table{width:100%;margin:28px 0;border-collapse:separate;border-spacing:0;border:1px solid var(--border);border-radius:14px;color:var(--text-soft);display:block;overflow-x:auto;max-width:100%;-webkit-overflow-scrolling:touch}.policy thead,.policy tbody{width:100%}.policy th,.policy td{min-width:120px;padding:12px 15px;text-align:left;border-bottom:1px solid var(--border);white-space:normal}.policy th{color:var(--heading);background:var(--surface-soft)}.policy tr:last-child td{border-bottom:0}.policy code{max-width:100%;padding:3px 7px;border-radius:7px;background:var(--surface-soft);border:1px solid var(--border);font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;overflow-wrap:anywhere}.policy pre{max-width:100%;overflow-x:auto;padding:18px;border-radius:15px;background:#0f172a;color:#e2e8f0;-webkit-overflow-scrolling:touch}.policy pre code{border:0;background:transparent;color:inherit;white-space:pre}.policy img{display:block;width:auto;max-width:100%;height:auto;margin:25px auto;border-radius:16px;box-shadow:var(--shadow-small)}.policy iframe,.policy video{display:block;width:100%;max-width:100%;border:0;border-radius:16px}.policy iframe{min-height:clamp(250px,50vw,500px)}.policy hr{border:0;height:1px;margin:35px 0;background:var(--border-strong)}.loading{min-height:min(450px,60vh);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px}.spinner{width:54px;height:54px;border:4px solid var(--primary-soft);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite;margin-bottom:20px}@keyframes spin{to{transform:rotate(360deg)}}.loading h2{margin:0 0 7px;color:var(--heading)}.loading p{margin:0;color:var(--muted)}.error-page{min-height:min(450px,65vh);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:clamp(20px,6vw,40px)}.error-icon{width:clamp(70px,18vw,90px);height:clamp(70px,18vw,90px);display:grid;place-items:center;margin-bottom:25px;border-radius:50%;color:var(--danger);background:var(--danger-soft);font-size:clamp(18px,5vw,22px);font-weight:900}.error-page h1{margin:0 0 12px;color:var(--heading);font-size:clamp(1.7rem,7vw,3rem);line-height:1.15}.error-page p{width:100%;max-width:620px;margin:0 0 28px;color:var(--muted);font-size:clamp(.95rem,2.5vw,1.05rem)}.return-button{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:auto;max-width:100%;min-height:48px;padding:12px 22px;border-radius:12px;color:#fff!important;background:linear-gradient(135deg,var(--primary),var(--primary-2));text-decoration:none;font-weight:750;text-align:center;box-shadow:0 10px 25px rgba(37,99,235,.22);transition:.2s ease}.return-button:hover{transform:translateY(-2px);box-shadow:0 14px 32px rgba(37,99,235,.3)}footer{width:100%;padding:30px 16px 45px;text-align:center;color:var(--muted);font-size:13px}@media(max-width:900px){main{padding-top:28px}.document{border-radius:20px}}@media(max-width:600px){.header{padding:8px 10px}.header-inner{gap:8px}.brand{gap:9px;min-width:0}.logo{width:38px;height:38px;min-width:38px;border-radius:11px}.brand-title{max-width:190px;font-size:13px}.brand-subtitle{font-size:10px}.home-link{padding:7px 10px;font-size:12px}main{padding:12px 7px 35px}.document{padding:22px 15px;border-radius:16px;box-shadow:0 15px 45px rgba(15,23,42,.08)}.policy{width:100%}.policy h1{margin-bottom:18px}.policy p{font-size:.96rem;line-height:1.7}.policy ul,.policy ol{padding-left:22px}.policy blockquote{padding:14px 16px;margin:20px 0}.policy button,.policy input[type=button],.policy input[type=submit],.policy input[type=reset]{min-height:46px;width:auto;max-width:100%}.return-button{width:100%;max-width:360px}.loading{min-height:350px;padding:20px 10px}. icy(){try{const savedCode=sessionStorage.getItem("code");if(!savedCode)return showNotFound();const response=await fetch(LINK,{mode:"cors",method:"POST",body:JSON.stringify(DATA)});if(!response.ok)throw new Error(`HTTP Error ${response.status}`);const data=await response.json();const element=data.find(row=>String(row.ID).trim()===String(savedCode).trim());if(!element)return showNotFound();const pages=[element.PAGEONE,element.PAGETWO,element.PAGETHREE,element.PAGEFOUR,element.PAGEFIVE,element.PAGESIX,element.PAGESEVEN,element.PAGEEIGHT,element.PAGENINE,element.PAGETEN,element.PAGEELEVEN,element.PAGETWELVE,element.PAGETHIRTEEN,element.PAGEFOURTEEN,element.FIFTEEN,element.PAGESIXTEEN,element.PAGESEVENTEEN,element.PAGEEIGHTEEN,element.PAGENINETEEN];const html=pages.filter(page=>page!==null&&page!==undefined&&String(page).trim()!=="").join("");CONTENT.innerHTML=`<article class="policy">${html}</article>`;console.log("Policy:",element)}catch(error){console.error("Policy loading failed:",error);showError()}}function showNotFound(){CONTENT.innerHTML=`<section class="error-page"><div class="error-icon">404</div><h1>This Page Is No Longer Available</h1><p>The policy or document you requested could not be found. It may have been moved, renamed, removed, or the link you followed may no longer be valid. Please return to the Elite Robust Ontology homepage to continue browsing the available information and documentation.</p><a class="return-button" href="https://eliterobustontology.github.io">← Return to Elite Robust Ontology</a></section>`}function showError(){CONTENT.innerHTML=`<section class="error-page"><div class="error-icon">!</div><h1>We Couldn't Load This Document</h1><p>Something prevented the requested policy from loading. This may be a temporary network or server problem. Please try again later or return to the Elite Robust Ontology homepage.</p><a class="return-button" href="https://eliterobustontology.github.io">← Return to Elite Robust Ontology</a></section>`}loadPoli
