<!DOCTYPE html>
<html>
<head>
<title>Color Image Generator</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{
    margin:0;
    font-family:Arial;
    background:#111;
    color:white;
    text-align:center;
}
.container{
    padding:40px;
}
input{
    width:80%;
    max-width:500px;
    padding:15px;
    font-size:18px;
    border-radius:10px;
    border:none;
}
button{
    margin:15px;
    padding:15px 30px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    font-size:16px;
}
canvas{
    margin-top:20px;
    max-width:90%;
    border-radius:20px;
}
#preview{
    margin:20px auto;
    width:200px;
    height:50px;
    border-radius:10px;
}
</style>
</head>
<body>
<div class="container">
<h1>Color Image Generator</h1>
<input id="colors"
placeholder="Example: black, gold, white"
oninput="previewColor()">
<br>
<div id="preview"></div>
<button onclick="generate()">
Generate Image
</button>
<br>
<canvas id="canvas"
width="900"
height="600">
</canvas>
<br>
<button onclick="downloadImage()">
Download Image
</button>
</div>
<script>
function getColors(){
let value=document
.getElementById("colors")
.value;
let colors=value
.split(",")
.map(x=>x.trim())
.filter(x=>x);
return colors;
}
function previewColor(){
let colors=getColors();
document.getElementById("preview")
.style.background=
"linear-gradient(90deg,"+
colors.join(",")+
")";
}
function generate(){
let colors=getColors();
if(colors.length==0){
alert("Enter colors");
return;
}
let canvas=document.getElementById("canvas");
let ctx=canvas.getContext("2d");
let gradient;
if(colors.length==1){
gradient=ctx.createLinearGradient(
0,
0,
900,
600
);
gradient.addColorStop(0,colors[0]);
gradient.addColorStop(1,colors[0]);
}
else{
gradient=ctx.createLinearGradient(
0,
0,
900,
600
);
colors.forEach((color,index)=>{
gradient.addColorStop(
index/(colors.length-1),
color
);
});
}
ctx.fillStyle=gradient;
ctx.fillRect(
0,
0,
900,
600
);
for(let i=0;i<15;i++){
ctx.beginPath();
ctx.arc(
Math.random()*900,
Math.random()*600,
Math.random()*100,
0,
Math.PI*2
);
ctx.fillStyle=colors[
Math.floor(Math.random()*colors.length)
];
ctx.globalAlpha=.2;
ctx.fill();
}
ctx.globalAlpha=1;
}
function downloadImage(){
let canvas=document.getElementById("canvas");
let link=document.createElement("a");
link.download="color-design.png";
link.href=canvas.toDataURL();
link.click();
}
</script>
</body>
</html>
