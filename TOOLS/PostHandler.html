body {

/* SIDEBAR */

.sidebar {

    z-index: 10;
}

.logo {
    font-size: 25px;
    font-weight: 800;
    margin-bottom: 5px;

.logo span {
    color: #60a5fa;

.company {

    margin-bottom: 35px;
}

.nav-item {
    padding: 13px 14px;
    margin-bottom: 7px;
    border-radius: 10px;
    cursor: pointer;
    color: #d1d5db;
}

.nav-item:hover,
.nav-item.active {
    background: #1f2937;
    color: white;
}

/* MAIN */

.main {
    margin-left: 250px;
    padding: 25px;
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
}

.header h1 {
    font-size: 28px;
}

.header p {
    color: var(--muted);
    margin-top: 5px;
}

.header-actions {
    display: flex;
    gap: 10px;
}

/* BUTTONS */

button {
    border: none;
    cursor: pointer;
    font-family: inherit;
}

.btn {
    padding: 11px 16px;
    border-radius: 9px;
    font-weight: 600;
}

.btn-primary {
    background: var(--primary);
    color: white;
}

.btn-primary:hover {
    background: var(--primary-dark);
}

.btn-light {
    background: white;
    border: 1px solid var(--border);
}

/* STATS */

.stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 15px;
    margin-bottom: 25px;
}

.stat {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px;
}

.stat-title {
    color: var(--muted);
    font-size: 13px;
}

.stat-number {
    font-size: 30px;
    font-weight: 800;
    margin-top: 8px;
}

/* TOOLBAR */

.toolbar {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 18px;
}

.search {
    flex: 1;
    min-width: 220px;
}

input,
select,
textarea {
    width: 100%;
    padding: 11px 12px;
    border: 1px solid var(--border);
    border-radius: 9px;
    outline: none;
    font-family: inherit;
    background: white;
}

textarea {
    resize: vertical;
}

/* CALENDAR */

.calendar-card {
    background: white;
    border: 1px solid var(--border);
    border-radius: 15px;
    overflow: hidden;
}

.calendar-head {
    padding: 18px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid var(--border);
}

.month-title {
    font-size: 20px;
    font-weight: 800;
}

.calendar-buttons {
    display: flex;
    gap: 7px;
}

.calendar-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
}

.day-name {
    background: #f8fafc;
    padding: 12px;
    text-align: center;
    font-size: 12px;
    font-weight: 700;
    color: var(--muted);
    border-bottom: 1px solid var(--border);
}

.day {
    min-height: 145px;
    padding: 9px;
    border-right: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    cursor: pointer;
}

.day:hover {
    background: #f8fafc;
}

.day-number {
    font-weight: 700;
    font-size: 13px;
    margin-bottom: 8px;
}

.today {
    background: #eff6ff;
}

.post {
    background: #f8fafc;
    border-left: 4px solid var(--primary);
    padding: 7px;
    border-radius: 6px;
    margin-bottom: 5px;
    font-size: 11px;
}

.post.instagram {
    border-color: #db2777;
}

.post.facebook {
    border-color: #2563eb;
}

.post.linkedin {
    border-color: #0a66c2;
}

.post.scheduled {
    background: #f0fdf4;
}

.post.published {
    background: #ecfdf5;
}

.post.draft {
    background: #fff7ed;
}

.post-title {
    font-weight: 700;
}

.post-status {
    font-size: 9px;
    color: var(--muted);
    margin-top: 3px;
}

/* MODAL */

.modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.55);
    z-index: 100;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.modal-overlay.show {
    display: flex;
}

.modal {
    background: white;
    width: min(700px, 100%);
    max-height: 90vh;
    overflow-y: auto;
    border-radius: 16px;
    padding: 25px;
}

.modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
}

.close {
    background: #f3f4f6;
    width: 35px;
    height: 35px;
    border-radius: 50%;
    font-size: 20px;
}

.form-group {
    margin-bottom: 15px;
}

.form-group label {
    display: block;
    font-size: 13px;
    font-weight: 700;
    margin-bottom: 6px;
}

.form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
}

.modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 20px;
}

/* POSTS LIST */

.posts-section {
    margin-top: 25px;
}

.posts-list {
    display: grid;
    gap: 12px;

.post-card {

    border-radius: 13px;
    padding: 17px;

.post-card-header {

.badge {

.badge-facebook {

    color: #1d4ed8;

.badge-instagram {

.badge-linkedin {

.badge-scheduled {

.badge-draft {

    color: #9a3412;

.badge-published {

    line-height: 1.6;

.post-actions {
    display: flex;
    gap: 8px;

.small-btn {

    border-radius: 7px;
    font-size: 12px;
    font-weight: 600;
    background: #f3f4f6;

    .sidebar {

        </div>

    </div>

            <div class="day-name">FRI</div>

        </div>

        <div class="calendar-grid" id="calendar"></div>

    </section>


    <!-- POSTS -->

    <section class="posts-section" id="postsSection">

    </section>

</main>


<!-- MODAL -->

<div class="modal-overlay" id="modal">

        <div class="modal-header">

        </div>

        <div class="form-group">
            <label>Post Title</label>

        </div>

        <div class="form-row">

        <div class="form-row">

                    <option>LinkedIn</option>
                </select>

            </div>

            <div class="form-group">
                <label>Status</label>

                    <option>Scheduled</option>
                    <option>Published</option>
                </select>

            </div>

        </div>

        <div class="form-group">

        </div>

        <div class="form-group">

            </button>

</div>

/* =========================================================
   STORAGE
========================================================= */

let posts = JSON.parse(
    localStorage.getItem("ero_social_posts")
) || defaultPosts;

let currentDate = new Date();


function saveStorage() {
    localStorage.setItem(
        "ero_social_posts",
        JSON.stringify(posts)
    );
}


/* =========================================================
   CALENDAR
========================================================= */

function renderCalendar() {

    const calendar = document.getElementById("calendar");

    calendar.innerHTML = "";

    const year = currentDate.getFullYear();
    const month = currentDate.getMonth();

    const monthName = currentDate.toLocaleString(
        "en-US",
        {
            month: "long",
            year: "numeric"
        }
    );

    document.getElementById("monthTitle").textContent =
        monthName;

    const firstDay =
        new Date(year, month, 1).getDay();

    const daysInMonth =
        new Date(year, month + 1, 0).getDate();

    const search =
        document.getElementById("searchInput").value.toLowerCase();

    const platform =
        document.getElementById("platformFilter").value;

    const status =
        document.getElementById("statusFilter").value;


    for(let i = 0; i < firstDay; i++) {

        const empty = document.createElement("div");

        empty.className = "day";

        calendar.appendChild(empty);

    }


    for(let day = 1; day <= daysInMonth; day++) {

        const cell = document.createElement("div");

        cell.className = "day";

        const dateString =
            `${year}-${String(month + 1).padStart(2,"0")}-${String(day).padStart(2,"0")}`;

        const today =
            new Date().toISOString().split("T")[0];

        if(dateString === today) {
            cell.classList.add("today");
        }


        const number =
            document.createElement("div");

        number.className = "day-number";

        number.textContent = day;

        cell.appendChild(number);


        const dayPosts =
            posts.filter(p => {

                const matchesDate =
                    p.date === dateString;

                const matchesSearch =
                    !search ||
                    p.title.toLowerCase().includes(search) ||
                    p.caption.toLowerCase().includes(search);

                const matchesPlatform =
                    platform === "all" ||
                    p.platform === platform;

                const matchesStatus =
                    status === "all" ||
                    p.status === status;

                return matchesDate &&
                       matchesSearch &&
                       matchesPlatform &&
                       matchesStatus;

            });


        dayPosts.forEach(post => {

            const postElement =
                document.createElement("div");

            postElement.className =
                `post ${post.platform.toLowerCase()} ${post.status.toLowerCase()}`;

            postElement.innerHTML = `

                <div class="post-title">
                    ${escapeHTML(post.title)}
                </div>

                <div>
                    ${escapeHTML(post.time)}
                </div>

                <div class="post-status">
                    ${escapeHTML(post.platform)}
                    ·
                    ${escapeHTML(post.status)}
                </div>

            `;

            postElement.onclick =
                (event) => {

                    event.stopPropagation();

                    editPost(post.id);

                };

            cell.appendChild(postElement);

        });


        cell.onclick = () => {

            openModal(dateString);

        };


        calendar.appendChild(cell);

    }

}


function previousMonth() {

    currentDate.setMonth(
        currentDate.getMonth() - 1
    );

    renderCalendar();

}


function nextMonth() {

    currentDate.setMonth(
        currentDate.getMonth() + 1
    );

    renderCalendar();

}


function goToday() {

    currentDate = new Date();

    renderCalendar();

}


/* =========================================================
   POSTS
========================================================= */

function renderPosts() {

    const container =
        document.getElementById("postsList");

    container.innerHTML = "";

    const search =
        document.getElementById("searchInput").value.toLowerCase();

    const platform =
        document.getElementById("platformFilter").value;

    const status =
        document.getElementById("statusFilter").value;


    const filtered =
        posts
        .filter(post => {

            const matchesSearch =
                !search ||
                post.title.toLowerCase().includes(search) ||
                post.caption.toLowerCase().includes(search);

            const matchesPlatform =
                platform === "all" ||
                post.platform === platform;

            const matchesStatus =
                status === "all" ||
                post.status === status;

            return matchesSearch &&
                   matchesPlatform &&
                   matchesStatus;

        })
        .sort((a,b) =>
            `${a.date}${a.time}`
            .localeCompare(`${b.date}${b.time}`)
        );


    filtered.forEach(post => {

        const card =
            document.createElement("div");

        card.className = "post-card";

        card.innerHTML = `

            <div class="post-card-header">

                <div>

                    <h3>
                        ${escapeHTML(post.title)}
                    </h3>

                    <small>
                        ${escapeHTML(post.date)}
                        ·
                        ${escapeHTML(post.time)}
                    </small>

                </div>

                <div>

                    <span class="badge badge-${post.platform.toLowerCase()}">
                        ${escapeHTML(post.platform)}
                    </span>

                    <span class="badge badge-${post.status.toLowerCase()}">
                        ${escapeHTML(post.status)}
                    </span>

                </div>

            </div>

            <div class="post-caption">
                ${escapeHTML(post.caption)}
            </div>

            <div class="post-actions">

                <button
                    class="small-btn"
                    onclick="copyCaption(${post.id})"
                >
                    📋 Copy
                </button>

                <button
                    class="small-btn"
                    onclick="editPost(${post.id})"
                >
                    ✏️ Edit
                </button>

                <button
                    class="small-btn"
                    onclick="deletePost(${post.id})"
                >
                    🗑️ Delete
                </button>

            </div>

        `;

        container.appendChild(card);

    });

}


/* =========================================================
   STATS
========================================================= */

function renderStats() {

    document.getElementById("totalPosts").textContent =
        posts.length;

    document.getElementById("scheduledPosts").textContent =
        posts.filter(p => p.status === "Scheduled").length;

    document.getElementById("publishedPosts").textContent =
        posts.filter(p => p.status === "Published").length;

    document.getElementById("draftPosts").textContent =
        posts.filter(p => p.status === "Draft").length;

}


/* =========================================================
   RENDER ALL
========================================================= */

function renderAll() {

    renderCalendar();

    renderPosts();

    renderStats();

}


/* =========================================================
   MODAL
========================================================= */

function openModal(date = "") {

    document.getElementById("modal").classList.add("show");

    document.getElementById("modalTitle").textContent =
        "Add Social Post";

    document.getElementById("postId").value = "";

    document.getElementById("postTitle").value = "";

    document.getElementById("postDate").value =
        date ||
        new Date().toISOString().split("T")[0];

    document.getElementById("postTime").value =
        "09:00";

    document.getElementById("postPlatform").value =
        "Facebook";

    document.getElementById("postStatus").value =
        "Draft";

    document.getElementById("postCaption").value = "";

    document.getElementById("postImage").value = "";

}


function closeModal() {

    document
        .getElementById("modal")
        .classList.remove("show");

}


function editPost(id) {

    const post =
        posts.find(p => p.id === id);

    if(!post) return;


    document.getElementById("modal").classList.add("show");

    document.getElementById("modalTitle").textContent =
        "Edit Social Post";

    document.getElementById("postId").value =
        post.id;

    document.getElementById("postTitle").value =
        post.title;

    document.getElementById("postDate").value =
        post.date;

    document.getElementById("postTime").value =
        post.time;

    document.getElementById("postPlatform").value =
        post.platform;

    document.getElementById("postStatus").value =
        post.status;

    document.getElementById("postCaption").value =
        post.caption;

    document.getElementById("postImage").value =
        post.image || "";

}


function savePost() {

    const id =
        document.getElementById("postId").value;

    const data = {

        date:
            document.getElementById("postDate").value,

        time:
            document.getElementById("postTime").value,

        title:
            document.getElementById("postTitle").value.trim(),

        platform:
            document.getElementById("postPlatform").value,

        status:
            document.getElementById("postStatus").value,

        caption:
            document.getElementById("postCaption").value.trim(),

        image:
            document.getElementById("postImage").value.trim()

    };


    if(!data.title || !data.date || !data.caption) {

        alert(
            "Please enter a title, date and caption."
        );

        return;

    }


    if(id) {

        const index =
            posts.findIndex(
                p => p.id == id
            );

        if(index !== -1) {

            posts[index] = {
                ...posts[index],
                ...data
            };

        }

    } else {

        posts.push({

            id: Date.now(),

            ...data

        });

    }


    saveStorage();

    closeModal();

    renderAll();

}


/* =========================================================
   DELETE
========================================================= */

function deletePost(id) {

    const post =
        posts.find(p => p.id === id);

    if(!post) return;


    if(
        confirm(
            `Delete "${post.title}"?`
        )
    ) {

        posts =
            posts.filter(
                p => p.id !== id
            );

        saveStorage();

        renderAll();

    }

}


/* =========================================================
   COPY
========================================================= */

function copyCaption(id) {

    const post =
        posts.find(p => p.id === id);

    if(!post) return;


    navigator.clipboard
        .writeText(post.caption)
        .then(() => {

            alert(
                "Caption copied to clipboard."
            );

        });

}


/* =========================================================
   EXPORT
========================================================= */

function exportData() {

    const data =
        JSON.stringify(posts, null, 2);

    const blob =
        new Blob(
            [data],
            {
                type: "application/json"
            }
        );

    const url =
        URL.createObjectURL(blob);

    const a =
        document.createElement("a");

    a.href = url;

    a.download =
        "ero-social-media-calendar.json";

    a.click();

    URL.revokeObjectURL(url);

}


/* =========================================================
   NAVIGATION
========================================================= */

function showSection(section) {

    if(section === "calendar") {

        document
            .getElementById("calendarSection")
            .scrollIntoView({
                behavior: "smooth"
            });

    }

    if(section === "posts") {

        document
            .getElementById("postsSection")
            .scrollIntoView({
                behavior: "smooth"
            });

    }

}


/* =========================================================
   SECURITY
========================================================= */

function escapeHTML(value) {

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}


/* =========================================================
   INITIALIZE
========================================================= */

renderAll();

</script>
