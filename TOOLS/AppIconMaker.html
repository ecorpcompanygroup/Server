<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image to JavaScript</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#0f0f0f;
    color:#fff;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.container{
    width:100%;
    max-width:800px;
    background:#1b1b1b;
    border-radius:18px;
    padding:30px;
    box-shadow:0 10px 30px rgba(0,0,0,.6);
    display:flex;
    flex-direction:column;
    gap:20px; /* Prevents any vertical elements from overlapping */
}

h1{
    text-align:center;
    font-size:24px;
    margin-bottom:10px;
}

.input-group{
    display:flex;
    flex-direction:column;
    gap:8px;
}

.input-group label{
    color:#aaa;
    font-size:14px;
}

#nameInput{
    width:100%;
    padding:14px;
    background:#111;
    color:#fff;
    border:1px solid #333;
    border-radius:12px;
    outline:none;
    font-size:16px;
}

#nameInput:focus{
    border-color:#00ff99;
}

.upload-box{
    border:2px dashed #555;
    border-radius:14px;
    padding:30px 20px;
    text-align:center;
    cursor:pointer;
    transition:.3s;
    font-size:16px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:6px;
}

.upload-box:hover{
    border-color:#00ff99;
    background:#151515;
}

input[type=file]{
    display:none;
}

.file-name{
    color:#00ff99;
    text-align:center;
    font-size:14px;
    word-break:break-all;
    max-width:100%;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    min-height:20px;
}

.preview{
    display:none;
    justify-content:center;
    align-items:center;
    width:100%;
    padding:10px 0;
}

.preview img{
    max-width:100%;
    max-height:250px;
    border-radius:12px;
    border:1px solid #333;
    object-fit:contain;
}

.textarea-container{
    display:flex;
    flex-direction:column;
    gap:8px;
}

textarea{
    width:100%;
    height:180px;
    resize:vertical;
    background:#111;
    color:#00ff99;
    border:1px solid #333;
    border-radius:12px;
    padding:15px;
    font-size:13px;
    word-break:break-all;
    overflow-y:auto;
}

.stats{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(180px, 1fr));
    gap:15px;
    width:100%;
}

.stat{
    background:#111;
    border-radius:10px;
    padding:14px;
    text-align:center;
    font-size:13px;
    color:#aaa;
    display:flex;
    flex-direction:column;
    gap:6px;
    border:1px solid #222;
}

.stat span{
    color:#fff;
    font-size:15px;
    font-weight:bold;
}

.button-group{
    display:flex;
    flex-direction:column;
    gap:12px;
}

button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:12px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;
    color:#fff;
}

#generateBtn{
    background:#00aa66;
}

#generateBtn:hover{
    background:#00cc77;
}

#copyBtn{
    background:#0077ff;
}

#copyBtn:hover{
    background:#3399ff;
}

#clearBtn{
    background:#8b2d2d;
}

#clearBtn:hover{
    background:#a83d3d;
}

</style>
</head>

<body>

<div class="container">

    <h1>Image to JavaScript</h1>

    <div class="input-group">
        <label for="nameInput">Variable Name</label>
        <input
            type="text"
            id="nameInput"
            placeholder="Enter variable name e.g. Logo"
        >
    </div>

    <label class="upload-box" for="fileInput">
        📁 Click to Select Image
        <small style="color:#aaa;">Select the image you want to convert</small>
    </label>

    <input
        type="file"
        id="fileInput"
        accept="image/*"
    >

    <div class="file-name" id="fileName">
        No image selected
    </div>

    <div class="preview" id="preview">
        <img id="previewImg" alt="Image preview">
    </div>

    <div class="textarea-container">
        <textarea
            id="output"
            readonly
            placeholder="Generated code will appear here..."
        ></textarea>
    </div>

    <div class="stats">
        <div class="stat">
            Characters
            <span id="charCount">0</span>
        </div>
        <div class="stat">
            Image Size
            <span id="fileSize">0 KB</span>
        </div>
        <div class="stat">
            Image Type
            <span id="fileType">-</span>
        </div>
    </div>

    <div class="button-group">
        <button id="generateBtn">Generate</button>
        <button id="copyBtn">Copy Code</button>
        <button id="clearBtn">Clear</button>
    </div>

</div>

<script>

const nameInput = document.getElementById("nameInput");
const fileInput = document.getElementById("fileInput");
const fileName = document.getElementById("fileName");
const preview = document.getElementById("preview");
const previewImg = document.getElementById("previewImg");
const output = document.getElementById("output");
const charCount = document.getElementById("charCount");
const fileSize = document.getElementById("fileSize");
const fileType = document.getElementById("fileType");
const generateBtn = document.getElementById("generateBtn");
const copyBtn = document.getElementById("copyBtn");
const clearBtn = document.getElementById("clearBtn");

/* SELECT IMAGE */
fileInput.addEventListener("change", () => {
    const file = fileInput.files[0];

    if(!file){
        fileName.textContent = "No image selected";
        preview.style.display = "none";
        previewImg.src = "";
        return;
    }

    fileName.textContent = file.name;
    fileSize.textContent = (file.size / 1024).toFixed(2) + " KB";
    fileType.textContent = file.type || "Unknown";

    const reader = new FileReader();
    reader.onload = () => {
        preview.style.display = "flex";
        previewImg.src = reader.result;
    };
    reader.readAsDataURL(file);
});

/* GENERATE CODE: const Name="Data"; */
generateBtn.addEventListener("click", () => {
    const name = nameInput.value.trim();
    const file = fileInput.files[0];

    if(!name){
        alert("Please enter a variable name.");
        nameInput.focus();
        return;
    }

    if(!/^[A-Za-z_$][A-Za-z0-9_$]*$/.test(name)){
        alert(
            "Invalid variable name.\n\n" +
            "Use letters, numbers, _ or $.\n\n" +
            "Example: Logo"
        );
        nameInput.focus();
        return;
    }

    if(!file){
        alert("Please select an image.");
        return;
    }

    const reader = new FileReader();

    reader.onload = () => {
        const base64Data = reader.result;
        const code = `const ${name}="${base64Data}";`;

        output.value = code;
        charCount.textContent = code.length.toLocaleString();
    };

    reader.onerror = () => {
        alert("Error reading file.");
    };

    reader.readAsDataURL(file);
});

/* COPY TO CLIPBOARD */
copyBtn.addEventListener("click", async () => {
    if(!output.value){
        alert("Nothing to copy.");
        return;
    }

    try{
        await navigator.clipboard.writeText(output.value);
        copyBtn.textContent = "Copied!";
        setTimeout(() => {
            copyBtn.textContent = "Copy Code";
        }, 2000);
    }catch(error){
        alert("Copy failed.");
    }
});

/* CLEAR ALL INPUTS */
clearBtn.addEventListener("click", () => {
    nameInput.value = "";
    fileInput.value = "";
    fileName.textContent = "No image selected";
    output.value = "";
    preview.style.display = "none";
    previewImg.src = "";
    charCount.textContent = "0";
    fileSize.textContent = "0 KB";
    fileType.textContent = "-";
});

</script>

</body>
</html>
