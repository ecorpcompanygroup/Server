<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image to JavaScript</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#0f0f0f;
    color:#fff;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.container{
    width:100%;
    max-width:900px;
    background:#1b1b1b;
    border-radius:18px;
    padding:25px;
    box-shadow:0 0 20px rgba(0,0,0,.5);
}

h1{
    text-align:center;
    margin-bottom:20px;
}

.input-group{
    margin-bottom:18px;
}

.input-group label{
    display:block;
    margin-bottom:8px;
    color:#aaa;
}

#nameInput{
    width:100%;
    padding:14px;
    background:#111;
    color:#fff;
    border:1px solid #333;
    border-radius:12px;
    outline:none;
    font-size:16px;
}

#nameInput:focus{
    border-color:#00ff99;
}

.upload-box{
    border:2px dashed #555;
    border-radius:14px;
    padding:40px;
    text-align:center;
    cursor:pointer;
    transition:.3s;
    font-size:18px;
}

.upload-box:hover{
    border-color:#00ff99;
    background:#151515;
}

input[type=file]{
    display:none;
}

.file-name{
    margin-top:12px;
    color:#00ff99;
    text-align:center;
}

.preview{
    margin-top:25px;
    display:none;
    justify-content:center;
}

.preview img{
    max-width:100%;
    max-height:350px;
    border-radius:12px;
    border:1px solid #333;
}

textarea{
    width:100%;
    height:250px;
    margin-top:25px;
    resize:vertical;
    background:#111;
    color:#00ff99;
    border:1px solid #333;
    border-radius:12px;
    padding:15px;
    font-size:13px;
    word-break:break-all;
}

button{
    width:100%;
    margin-top:18px;
    padding:15px;
    border:none;
    border-radius:12px;
    font-size:16px;
    cursor:pointer;
    transition:.3s;
    color:#fff;
}

#generateBtn{
    background:#00aa66;
}

#generateBtn:hover{
    background:#00cc77;
}

#copyBtn{
    background:#0077ff;
}

#copyBtn:hover{
    background:#3399ff;
}

#clearBtn{
    background:#8b2d2d;
}

#clearBtn:hover{
    background:#a83d3d;
}

.stats{
    margin-top:20px;
    display:flex;
    gap:15px;
    flex-wrap:wrap;
}

.stat{
    flex:1;
    min-width:180px;
    background:#111;
    border-radius:10px;
    padding:12px;
    text-align:center;
}

</style>
</head>

<body>

<div class="container">

    <h1>Image to JavaScript</h1>

    <div class="input-group">

        <label for="nameInput">
            Variable Name
        </label>

        <input
            type="text"
            id="nameInput"
            placeholder="Enter variable name e.g. Logo"
        >

    </div>

    <label class="upload-box" for="fileInput">

        📁 Click to Select Image

        <br>

        <small style="
            display:block;
            margin-top:8px;
            color:#aaa;
        ">
            Select the image you want to convert
        </small>

    </label>

    <input
        type="file"
        id="fileInput"
        accept="image/*"
    >

    <div
        class="file-name"
        id="fileName"
    >
        No image selected
    </div>

    <div
        class="preview"
        id="preview"
    >
        <img id="previewImg">
    </div>

    <textarea
        id="output"
        readonly
        placeholder='Generated code will appear here...'
    ></textarea>

    <div class="stats">

        <div class="stat">
            Characters
            <br><br>
            <span id="charCount">0</span>
        </div>

        <div class="stat">
            Image Size
            <br><br>
            <span id="fileSize">0 KB</span>
        </div>

        <div class="stat">
            Image Type
            <br><br>
            <span id="fileType">-</span>
        </div>

    </div>

    <button id="generateBtn">
        Generate
    </button>

    <button id="copyBtn">
        Copy Code
    </button>

    <button id="clearBtn">
        Clear
    </button>

</div>

<script>

const MAX_CHARS = 50000;

const nameInput =
    document.getElementById("nameInput");

const fileInput =
    document.getElementById("fileInput");

const fileName =
    document.getElementById("fileName");

const preview =
    document.getElementById("preview");

const previewImg =
    document.getElementById("previewImg");

const output =
    document.getElementById("output");

const charCount =
    document.getElementById("charCount");

const fileSize =
    document.getElementById("fileSize");

const fileType =
    document.getElementById("fileType");

const generateBtn =
    document.getElementById("generateBtn");

const copyBtn =
    document.getElementById("copyBtn");

const clearBtn =
    document.getElementById("clearBtn");


/* ================================
   IMAGE TO DATA URL
================================ */

async function imageToDataURL(
    file,
    maxWidth,
    maxHeight,
    quality,
    mimeType
){

    const bitmap =
        await createImageBitmap(file);

    const scale = Math.min(
        1,
        maxWidth / bitmap.width,
        maxHeight / bitmap.height
    );

    const width =
        Math.max(
            1,
            Math.round(bitmap.width * scale)
        );

    const height =
        Math.max(
            1,
            Math.round(bitmap.height * scale)
        );

    const canvas =
        document.createElement("canvas");

    canvas.width = width;
    canvas.height = height;

    const ctx =
        canvas.getContext(
            "2d",
            {
                alpha:true
            }
        );

    ctx.drawImage(
        bitmap,
        0,
        0,
        width,
        height
    );

    bitmap.close();

    return canvas.toDataURL(
        mimeType,
        quality
    );
}


/* ================================
   COMPRESS IMAGE
================================ */

async function compressImage(file){

    const supportsWebP =
        document
        .createElement("canvas")
        .toDataURL("image/webp")
        .startsWith("data:image/webp");

    const mimeType =
        supportsWebP
        ? "image/webp"
        : "image/jpeg";

    let maxWidth = 1600;
    let maxHeight = 1600;

    let low = 0.10;
    let high = 0.95;

    let best = null;


    /*
        First try reducing quality
    */

    for(let i = 0; i < 9; i++){

        const quality =
            (low + high) / 2;

        const candidate =
            await imageToDataURL(
                file,
                maxWidth,
                maxHeight,
                quality,
                mimeType
            );

        if(candidate.length <= MAX_CHARS){

            best = candidate;
            low = quality;

        }else{

            high = quality;

        }

    }


    /*
        If quality is not enough,
        reduce image dimensions
    */

    if(!best){

        let width = 1400;

        for(let i = 0; i < 10; i++){

            const candidate =
                await imageToDataURL(
                    file,
                    width,
                    width,
                    0.80,
                    mimeType
                );

            if(candidate.length <= MAX_CHARS){

                best = candidate;
                break;

            }

            width =
                Math.round(width * 0.80);

        }

    }


    /*
        Final fallback
    */

    if(!best){

        best =
            await imageToDataURL(
                file,
                100,
                100,
                0.50,
                mimeType
            );

    }

    return best;
}


/* ================================
   SELECT IMAGE
================================ */

fileInput.addEventListener(
    "change",
    () => {

        const file =
            fileInput.files[0];

        if(!file){

            fileName.textContent =
                "No image selected";

            return;
        }

        fileName.textContent =
            file.name;

        fileSize.textContent =
            (file.size / 1024).toFixed(2)
            + " KB";

        fileType.textContent =
            file.type || "Unknown";


        /*
            Show original preview
        */

        const reader =
            new FileReader();

        reader.onload = () => {

            preview.style.display =
                "flex";

            previewImg.src =
                reader.result;

        };

        reader.readAsDataURL(file);

    }
);


/* ================================
   GENERATE
================================ */

generateBtn.addEventListener(
    "click",
    async () => {

        const name =
            nameInput.value.trim();

        const file =
            fileInput.files[0];


        /*
            Validate name
        */

        if(!name){

            alert(
                "Please enter a variable name."
            );

            nameInput.focus();

            return;
        }


        /*
            Validate JavaScript variable name
        */

        if(
            !/^[A-Za-z_$][A-Za-z0-9_$]*$/.test(name)
        ){

            alert(
                "Invalid variable name.\n\n" +
                "Use letters, numbers, _ or $.\n\n" +
                "Example: Logo"
            );

            nameInput.focus();

            return;
        }


        /*
            Validate image
        */

        if(!file){

            alert(
                "Please select an image."
            );

            return;
        }


        generateBtn.textContent =
            "Generating...";

        generateBtn.disabled =
            true;

        output.value =
            "Generating...";

        charCount.textContent =
            "...";


        try{

            const base64 =
                await compressImage(file);


            /*
                Generate JavaScript
            */

            const code =
                `const ${name}="${base64}";`;


            output.value =
                code;


            charCount.textContent =
                code.length.toLocaleString();


            generateBtn.textContent =
                "Generate";


        }catch(error){

            console.error(error);

            output.value = "";

            charCount.textContent =
                "0";

            alert(
                "Unable to generate the image."
            );

        }finally{

            generateBtn.disabled =
                false;

            generateBtn.textContent =
                "Generate";

        }

    }
);


/* ================================
   COPY
================================ */

copyBtn.addEventListener(
    "click",
    async () => {

        if(!output.value){

            alert(
                "Nothing to copy."
            );

            return;
        }

        try{

            await navigator.clipboard.writeText(
                output.value
            );

            copyBtn.textContent =
                "Copied!";

            setTimeout(
                () => {

                    copyBtn.textContent =
                        "Copy Code";

                },
                2000
            );

        }catch(error){

            alert(
                "Copy failed."
            );

        }

    }
);


/* ================================
   CLEAR
================================ */

clearBtn.addEventListener(
    "click",
    () => {

        nameInput.value = "";

        fileInput.value = "";

        fileName.textContent =
            "No image selected";

        output.value = "";

        preview.style.display =
            "none";

        previewImg.src = "";

        charCount.textContent =
            "0";

        fileSize.textContent =
            "0 KB";

        fileType.textContent =
            "-";

    }
);

</script>

</body>
</html>
