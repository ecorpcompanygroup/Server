<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ELINTON UPDATER</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Cambria, sans-serif;
            text-decoration: none;
            list-style: none;
            border: none;
        }
        :root {
            --bg: #050711;
            --bg2: #0c1020;
            --card: rgba(17, 21, 42, 0.72);
            --text: #ffffff;
            --muted: #9da6c3;
            --border: rgba(255, 255, 255, 0.10);
            --primary: #705cff;
            --primary2: #8b7cff;
            --secondary: #00d9ff;
            --shadow:
                0 30px 100px rgba(0, 0, 0, 0.55),
                0 0 80px rgba(112, 92, 255, 0.12);
        }
        html,
        body {
            width: 100%;
            height: 100%;
        }
        body {
            position: fixed;
            inset: 0;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: var(--text);
            background:
                radial-gradient(
                    circle at 10% 15%,
                    rgba(112, 92, 255, 0.22),
                    transparent 32%
                ),
                radial-gradient(
                    circle at 90% 85%,
                    rgba(0, 217, 255, 0.14),
                    transparent 32%
                ),
                radial-gradient(
                    circle at 50% 50%,
                    rgba(112, 92, 255, 0.04),
                    transparent 55%
                ),
                linear-gradient(
                    135deg,
                    var(--bg),
                    var(--bg2)
                );
        }
        .orb {
            position: fixed;
            border-radius: 50%;
            pointer-events: none;
            filter: blur(90px);
            opacity: 0.16;
            animation: float 9s ease-in-out infinite;
        }
        .orb.one {
            width: 280px;
            height: 280px;
            top: -130px;
            right: -80px;
            background: var(--primary);
        }
        .orb.two {
            width: 240px;
            height: 240px;
            bottom: -120px;
            left: -80px;
            background: var(--secondary);
            animation-delay: -3s;
        }
        .orb.three {
            width: 180px;
            height: 180px;
            top: 45%;
            left: 42%;
            background: var(--primary);
            opacity: 0.05;
            animation-delay: -6s;
        }
        @keyframes float {
            0%,
            100% {
                transform: translate3d(0, 0, 0);
            }
            50% {
                transform: translate3d(0, 25px, 0);
            }
        }
        .container {
            width: 100%;
            max-width: 470px;
            position: relative;
            z-index: 5;
            animation: appear 0.7s ease forwards;
        }
        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.97);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        .card {
            position: relative;
            width: 100%;
            padding: 48px 42px 40px;
            text-align: center;
            background:
                linear-gradient(
                    145deg,
                    rgba(255, 255, 255, 0.07),
                    rgba(255, 255, 255, 0.025)
                ),
                var(--card);
            border: 1px solid var(--border);
            border-radius: 30px;
            box-shadow: var(--shadow);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            overflow: hidden;
        }
        .card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 12%;
            width: 76%;
            height: 1px;
            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(255,255,255,0.35),
                    transparent
                );
        }
        .logo {
            position: relative;
            width: 86px;
            height: 86px;
            margin: 0 auto 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 25px;
            background:
                linear-gradient(
                    135deg,
                    var(--primary),
                    var(--secondary)
                );
            font-size: 28px;
            font-weight: bold;
            letter-spacing: -1px;
            box-shadow:
                0 18px 45px rgba(112, 92, 255, 0.30),
                inset 0 1px 0 rgba(255,255,255,0.35);
            animation: logoFloat 4s ease-in-out infinite;
        }
        @keyframes logoFloat {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-5px);
            }
        }
        .logo::before {
            content: "";
            position: absolute;
            inset: -7px;
            border-radius: 31px;
            border: 1px solid rgba(255,255,255,0.08);
        }
        .logo::after {
            content: "";
            position: absolute;
            width: 18px;
            height: 18px;
            top: -5px;
            right: -5px;
            border-radius: 50%;
            background: var(--secondary);
            box-shadow:
                0 0 20px rgba(0,217,255,0.7);
        }
        h1 {
            font-size: 35px;
            font-weight: 700;
            letter-spacing: -1px;
            margin-bottom: 12px;
        }
        .description {
            max-width: 370px;
            margin: 0 auto 27px;
            color: var(--muted);
            font-size: 16px;
            line-height: 1.7;
        }
        .status {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 7px 12px;
            margin-bottom: 25px;
            border-radius: 30px;
            background: rgba(255,255,255,0.045);
            border: 1px solid rgba(255,255,255,0.07);
            color: #cbd1e5;
            font-size: 13px;
        }
        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #43e97b;
            box-shadow:
                0 0 10px rgba(67,233,123,0.7);
        }
        button.Update {
            position: relative;
            width: 100%;
            min-height: 58px;
            padding: 16px 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            border-radius: 16px;
            background:
                linear-gradient(
                    135deg,
                    var(--primary),
                    var(--primary2) 48%,
                    var(--secondary)
                );
            background-size: 200% 200%;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            box-shadow:
                0 15px 35px rgba(112, 92, 255, 0.28);
            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease,
                background-position 0.5s ease,
                filter 0.25s ease;
        }
        button.Update::before {
            content: "↻";
            font-size: 21px;
            transition: transform 0.3s ease;
        }
        button.Update:hover {
            transform: translateY(-3px);
            background-position: 100% 50%;
            box-shadow:
                0 20px 45px rgba(112, 92, 255, 0.40);
            filter: brightness(1.08);
        }
        button.Update:hover::before {
            transform: rotate(180deg);
        }
        button.Update:active {
            transform: translateY(0) scale(0.99);
            box-shadow:
                0 10px 25px rgba(112, 92, 255, 0.25);
        }
        button.Update:disabled {
            cursor: not-allowed;
            opacity: 0.75;
            transform: none;
        }
        .version {
            margin-top: 22px;
            color: var(--muted);
            font-size: 13px;
            opacity: 0.7;
        }
        .footer-line {
            width: 80px;
            height: 1px;
            margin: 28px auto 0;
            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(255,255,255,0.18),
                    transparent
                );
        }
        .loadholder {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            background:
                rgba(5, 7, 17, 0.88);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            z-index: 100;
        }
        .loading-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
        }
        .LoadingIcon {
            width: 55px;
            height: 55px;
            border: 4px solid rgba(255,255,255,0.10);
            border-top-color: var(--secondary);
            border-right-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.75s linear infinite;
            box-shadow:
                0 0 35px rgba(0,217,255,0.18);
        }
        .loading-text {
            color: #d8dced;
            font-size: 15px;
            letter-spacing: 0.2px;
        }
        @keyframes spin {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }
        @media (max-width: 500px) {
            body {
                padding: 15px;
            }
            .card {
                padding: 40px 24px 32px;
                border-radius: 25px;
            }
            .logo {
                width: 76px;
                height: 76px;
                border-radius: 22px;
                font-size: 25px;
            }
            h1 {
                font-size: 30px;
            }
            .description {
                font-size: 15px;
                line-height: 1.6;
            }
            button.Update {
                min-height: 55px;
                font-size: 16px;
            }
        }
        @media (max-height: 600px) {
            .card {
                padding-top: 28px;
                padding-bottom: 25px;
            }
            .logo {
                width: 65px;
                height: 65px;
                margin-bottom: 15px;
            }
            h1 {
                font-size: 28px;
            }
            .description {
                margin-bottom: 18px;
            }
            .status {
                margin-bottom: 17px;
            }
            .footer-line {
                margin-top: 18px;
            }
        }
    </style>
    <script>
        const ROUTED = e => {
            const t = document.createElement("script");
            t.textContent = e;
            document.head.appendChild(t);
        };
    </script>
    <script  src="./CONNECTION/ServerConnection.js"></script>
</head>
<body>
    <div class="orb one"></div>
    <div class="orb two"></div>
    <div class="orb three"></div>
    <main class="container">
        <section class="card">
            <div class="logo">
                E S
            </div>
            <h1>
                Elinton Server 
            </h1>
            <p class="description">
                Keep your Movie Lander project up to date
                with the latest improvements, features and fixes.
            </p>
            <div class="status">
                <span class="status-dot"></span>
                Project ready to update
            </div>
            <button class="Update">
                Update Project
            </button>
            <div class="version">
                Elinton  Project Updater
            </div>
            <div class="footer-line"></div>
        </section>
    </main>
    <div class="loadholder">
        <div class="loading-box">
            <div class="LoadingIcon"></div>
            <div class="loading-text">
                Updating  Server...
            </div>
        </div>
    </div>
</body>
<script>
    const Update = document.querySelector(".Update");
    const LoadHolder = document.querySelector(".loadholder");
    Update.addEventListener("click", () => {
        Update.innerHTML = "Project Updating...";
        Update.disabled = true;
        LoadHolder.style.display = "flex";
        CLOUDUPDATE(Update);
    });
</script>
<script type="module" src="./CONNECTION/ServerConnection.js"></script>
</html>
